<!DOCTYPE html>
<html>
<head>
  <title>Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial; background:#eef; padding:20px; }
    h2 { text-align:center; }
    .box {
      background:white;
      padding:20px;
      border-radius:8px;
    }
  </style>
</head>

<body>

<h2>🧑‍💼 Admin Dashboard</h2>

<div class="box">
  <p><b>Role:</b> Admin / Customer Care</p>
  <p>
    Passenger alerts are received via
    <b>official email</b>.
  </p>
  <p>
    Each alert contains a <b>Google Maps link</b>.
  </p>
  <p>
    Admin clicks the link to <b>track the bus location</b>
    (based on passenger live GPS).
  </p>
</div>

</body>
</html>
